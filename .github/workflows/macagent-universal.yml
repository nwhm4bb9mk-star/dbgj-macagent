# 仅编本仓库根目录下的 macagent（独立小库，勿整仓 DBGJ）
name: macagent-universal
on:
  workflow_dispatch:
  push:
    branches: [main, master]
permissions:
  contents: write
jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'
      - name: build universal
        run: bash build-universal.sh
      - uses: actions/upload-artifact@v4
        with:
          name: macagent-universal
          path: macagent
      - name: publish latest release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: macagent latest
          files: macagent
          make_latest: true
          body: 'oneclick: curl -fsSL https://raw.githubusercontent.com/nwhm4bb9mk-star/dbgj-macagent/main/oneclick.sh | bash'
