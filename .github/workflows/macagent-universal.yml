# 仅编本仓库根目录下的 macagent（独立小库，勿整仓 DBGJ）
name: macagent-universal
on:
  workflow_dispatch:
  push:
    branches: [main, master]
jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'
      - name: build universal
        run: bash build-universal.sh
      - uses: actions/upload-artifact@v4
        with:
          name: macagent-universal
          path: macagent
